services:
  caddy-proxy-manager:
    build: .
    container_name: caddy-proxy-manager
    restart: unless-stopped
    network_mode: host           # 使用宿主机网络，端口按需占用
    volumes:
      - ./data:/app/data                    # 数据库持久化
      - caddy_data:/var/lib/caddy           # Caddy 数据 (SSL 证书)
      - caddy_config:/etc/caddy             # Caddy 配置
      - caddy_logs:/var/log/caddy           # Caddy 日志
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PORT=3000

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  caddy_logs:
    driver: local
